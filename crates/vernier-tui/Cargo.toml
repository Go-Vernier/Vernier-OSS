[package]
name = "vernier-tui"
description = "vernier tui: explore the service graph and walk a change interactively"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "vernier_tui"
path = "src/lib.rs"

[dependencies]
vernier-core = { path = "../vernier-core" }
# line_count sizes wrapped text exactly; it is the only unstable API used.
ratatui = { workspace = true, features = ["unstable-rendered-line-info"] }
anyhow.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true

[lints]
workspace = true
