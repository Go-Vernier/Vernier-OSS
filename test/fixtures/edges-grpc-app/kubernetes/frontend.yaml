apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  template:
    spec:
      containers:
        - name: server
          image: acme/frontend:1.0
          env:
            - name: CART_SERVICE_ADDR
              value: "cartservice:7070"
            - name: SHIPPING_SERVICE_ADDR
              value: "shippingservice:50051"
